name: "기본 기능 구성"
run-name: ${{ github.actor }} 가 Terraform Cloud에 핵심 Workspace 및 권한을 설정

on:
  push:
    # 작업 디랙토리 지정
    paths:
      - 'aws/2026/11/bootstrap/**'

# Runner 환경 변수
env:
  TERRAFORM_PLAN_FILE: create_workspace
  WORKING_DIRECTORY: 'aws/2026/11/bootstrap/'

# Jobs 생성
jobs:
  bootstrap-terraform-cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: "저장소 소스코드 가져오기"
        uses: actions/checkout@v7.0.1

      - name: "Terraform 도구 설치"
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.4"
          cli_config_credentials_token: ${{ secrets.ORGANIZATION_LEE_PERSONAL_PROJECT_TOKEN }}

      - name: "Terraform Provider 설치"
        run: terraform init -input=false

      - name: "Terraform Validation"
        run: terraform validate -no-color

      - name: "Terraform Plan"
        run: terraform plan -out ${{ env.TERRAFORM_PLAN_FILE }} -no-input -no-color

      - name: "Terraform Apply"
        run: terraform apply ${{ env.TERRAFORM_PLAN_FILE }} -no-color